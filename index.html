<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mario ramirez-arrazola</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>
      <a href="index.html">mario ramirez-arrazola</a>
    </h1>

    <nav aria-label="Main navigation">
      <a href="info.html">info</a>
      <a href="marra.html">marra</a>
      <a href="morris.html">morris</a>
    </nav>
  </header>

  <main>
    <div
      class="random-gallery"
      id="home-gallery"
      aria-label="Selected images"
    ></div>
  </main>

  <script>
    const gallery = document.getElementById("home-gallery");

    // Shuffle all image numbers so the three selections are different.
    const numbers = Array.from({ length: 353 }, (_, i) => i + 1);

    for (let i = numbers.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
    }

    const positions = ["start", "center", "end"];

    numbers.slice(0, 3).forEach((number, index) => {
      const frame = document.createElement("figure");
      frame.className = "gallery-frame";

      // Vary the composition without rotating or overlapping images.
      frame.style.setProperty(
        "--offset",
        `${Math.floor(Math.random() * 180)}px`
      );

      frame.style.setProperty(
        "--image-width",
        `${72 + Math.floor(Math.random() * 29)}%`
      );

      frame.style.setProperty(
        "--alignment",
        positions[Math.floor(Math.random() * positions.length)]
      );

      const image = document.createElement("img");
      image.src = `${number}.png`;
      image.alt = `Selected work, image ${number}`;
      image.decoding = "async";

      // Hide a missing image rather than displaying a broken image icon.
      image.addEventListener("error", () => frame.remove());

      frame.appendChild(image);
      gallery.appendChild(frame);
    });
  </script>
</body>
</html>
