<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mario ramirez-arrazola</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1><a href="#">mario ramirez-arrazola</a></h1>

    <nav aria-label="Main navigation">
      <a href="#about">about</a>
      <a href="#marra">marra</a>
      <a href="#morris">morris</a>
    </nav>
  </header>

  <main>
    <!-- Add your about content here. -->
    <section id="about" aria-label="about" hidden>
    </section>

    <!-- Add your marra content here. -->
    <section id="marra" aria-label="marra" hidden>
    </section>

    <!-- Add your morris content here. -->
    <section id="morris" aria-label="morris" hidden>
    </section>
  </main>

  <script>
    function showSection() {
      const selected = window.location.hash.slice(1);

      document.querySelectorAll("main section").forEach(section => {
        section.hidden = section.id !== selected;
      });

      document.querySelectorAll("nav a").forEach(link => {
        if (link.hash === window.location.hash) {
          link.setAttribute("aria-current", "page");
        } else {
          link.removeAttribute("aria-current");
        }
      });
    }

    window.addEventListener("hashchange", showSection);
    showSection();
  </script>
</body>
</html>
